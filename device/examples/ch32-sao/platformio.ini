; SAOv3 device example for WCH CH32 parts.
;
; The library needs no include paths or source filters of its own - it works out which port to build from the chip
; macros the board definition already supplies. The only project-specific bit is -Isrc/, which is how the library
; finds this project's saod_user_cfg.h.

[env]
platform = ch32v
framework = noneos-sdk
monitor_speed = 115200

; Makes saod_user_cfg.h discoverable to the library sources
build_flags = -Isrc/

; Points at the library folder two levels up (this example lives inside the library repo).
; From your own project, drop the library into lib/ instead, or use:
;   lib_deps = https://github.com/RareCircuits/SAOv3-lib.git
lib_deps = symlink://../..

[env:ch32x035f8u6_evt_r0]
board = ch32x035f8u6_evt_r0

; CH32V003 works too, but check the pin assignments in src/board.h first - the packages differ.
; Note the library automatically drops its SMBus buffer to 32 bytes on this part to fit the 2K of RAM.
[env:genericCH32V003F4P6]
board = genericCH32V003F4P6

; Flash through a picorvd probe (an RP2040 acting as a ch32v003 debugger)
; rather than the default wch-link/OpenOCD.
upload_protocol = custom
upload_command = "$PROJECT_DIR/scripts/picorvd_upload.sh" "$BUILD_DIR/${PROGNAME}.elf"
